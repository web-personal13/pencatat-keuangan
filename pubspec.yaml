name: pencatat_keuangan
description: "Dompi - Aplikasi pencatat keuangan harian pribadi."
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.19.0
  excel: ^4.0.6
  path_provider: ^2.1.2
  share_plus: ^10.0.0
  fl_chart: ^0.68.0
  shared_preferences: ^2.2.3
  mobile_scanner: ^5.2.3
  google_fonts: ^6.2.1
  animations: ^2.0.11
  flutter_animate: ^4.5.0
  http: ^1.2.2
  google_mlkit_text_recognition: ^0.15.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FCD535"
  adaptive_icon_foreground: "assets/icon/icon.png"
  remove_alpha_ios: true
  web:
    generate: false